# Disposable synthetic-data stack; invoked only with a unique project name.
x-api: &api
  image: webhook-dispatcher:verify-${VERIFY_RUN_ID:?Set VERIFY_RUN_ID}
  build:
    context: ..
  cpus: 2
  mem_limit: 512m
  ports: ["127.0.0.1::8080"]
  environment: &api-env
    APP_ENV: development
    HTTP_ADDR: ":8080"
    DATABASE_URL: postgres://webhook:verification-only@postgres:5432/webhook?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    REDIS_STREAM: verification-deliveries
    REDIS_CONSUMER_GROUP: verification-workers
    SECRET_ENCRYPTION_KEY: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
    AUTH_ENABLED: "true"
    API_KEY: verification-only
    ALLOW_PRIVATE_TARGETS: "true"
    WORKER_COUNT: "4"
    OUTBOX_POLL_INTERVAL: 100ms
    DELIVERY_MAX_ATTEMPTS: "3"
    DELIVERY_BASE_BACKOFF: 200ms
    DELIVERY_MAX_BACKOFF: 400ms
    CIRCUIT_FAILURE_THRESHOLD: "3"
    CIRCUIT_OPEN_COOLDOWN: 5s
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  api: *api
  restored-api:
    <<: *api
    profiles: [restore]
    environment:
      <<: *api-env
      DATABASE_URL: postgres://webhook:verification-only@postgres:5432/verification_restore?sslmode=disable
      REDIS_STREAM: verification-restored
  postgres:
    image: postgres:16-alpine
    cpus: 1
    mem_limit: 512m
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: verification-only
      POSTGRES_DB: webhook
    ports: ["127.0.0.1::5432"]
    healthcheck:
      # The initialization server accepts Unix sockets before the TCP server starts.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U webhook -d webhook"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    cpus: 0.5
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  target-simulator:
    image: webhook-targetsim:verify-${VERIFY_RUN_ID}
    build:
      context: ..
      args: {CMD_PATH: ./cmd/targetsim}
    cpus: 1
    mem_limit: 128m
    environment: {TARGETSIM_ADDR: ":9090"}
  prometheus:
    image: prom/prometheus:latest
    ports: ["127.0.0.1::9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:latest
    ports: ["127.0.0.1::3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: verification-only
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
